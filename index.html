<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Portfolio | Kevin James Plaza</title>
    <style>
        body {
            background-color: #E0F2F7;
            font-family: 'Times New Roman', serif;
            color: #333;
            margin: 0;
            padding: 20px;
            border: 5px ridge #99CCFF;
            text-align: center;
        }

        /* This creates the horizontal ( ) ( ) ( ) layout */
        .section-row {
            display: flex;
            justify-content: center; /* Centers the group */
            gap: 20px;               /* Space between items */
            margin-bottom: 40px;
            flex-wrap: wrap;         /* Allows it to fit on phone screens */
        }

        /* Keeps the image and its specific text aligned vertically */
        .item-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 120px;
        }

        .item-card img, .item-card video {
            width: 100px;
            height: 100px;
            object-fit: cover; /* Prevents stretching */
            border-radius: 8px;
            border: 2px solid #99CCFF;
        }

        .label {
            margin-top: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        /* Form styling */
        .contact-form {
            max-width: 300px;
            margin: 0 auto;
            text-align: left;
        }
        
        input, textarea {
            width: 100%;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 5px;
        }
    </style>
</head>
<body>

    <h1>My Portfolio</h1>
    <p>Hi, I'm Kevin James Plaza, a 2nd year IT student.</p>

    <h2>Personal Photos</h2>
    <div class="section-row">
        <div class="item-card">
            <img src="Groupo.jpg" alt="Photo">
            <div class="label">BFFS</div>
        </div>
        <div class="item-card">
            <img src="G2.jpg" alt="Photo">
            <div class="label">BFS</div>
        </div>
        <div class="item-card">
            <img src="Bffs.jpg" alt="Photo">
            <div class="label">FRIENDS</div>
        </div>
    </div>

    <h2>Certifications</h2>
    <div class="section-row">
        <div class="item-card">
            <img src="Groupo.jpg" alt="Cert">
            <div class="label">Cert 1</div>
        </div>
        <div class="item-card">
            <img src="G2.jpg" alt="Cert">
            <div class="label">Cert 2</div>
        </div>
        <div class="item-card">
            <img src="Bffs.jpg" alt="Cert">
            <div class="label">Cert 3</div>
        </div>
    </div>

    <h2>My Videos</h2>
    <div class="section-row">
        <div class="item-card">
            <video src="mahaw.mp4" controls></video>
            <div class="label">4fun1</div>
        </div>
        <div class="item-card">
            <video src="View.mp4" controls></video>
            <div class="label">4fun2</div>
        </div>
        <div class="item-card">
            <video src="musicvid.mp4" controls></video>
            <div class="label">4fun3</div>
        </div>
    </div>

    <h2>Contact Me</h2>
    <div class="contact-form">
        <input type="text" placeholder="First Name">
        <input type="text" placeholder="Last Name">
        <input type="email" placeholder="Email">
        <textarea rows="3" placeholder="Message"></textarea>
        <button type="submit" style="width: 100%;">Submit</button>
    </div>

    <div style="margin-top: 30px;">
        <h3>Change Background</h3>
        <input type="color" id="bgColorPicker">
    </div>

    <script>
        const picker = document.getElementById('bgColorPicker');
        window.onload = () => {
            const saved = localStorage.getItem('bg');
            if(saved) { document.body.style.backgroundColor = saved; picker.value = saved; }
        }
        picker.oninput = () => {
            document.body.style.backgroundColor = picker.value;
            localStorage.setItem('bg', picker.value);
        }
    </script>

</body>
</html>
